name: release

# Run by hand from the Actions tab after the pull request is merged. It runs the Python,
# Julia, C and C++ checks, then publishes a GitHub release with the paper files in dist/
# and the notes in .github/RELEASE_NOTES.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "The sl(2) weight system at c = -3/32 extends to a graph 4-invariant"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Python, Julia, C and C++ checks
        run: ./run_all.sh

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/Sl2WeightSystemAtMinus3Over32_final2.pdf \
                   dist/Sl2WeightSystemAtMinus3Over32_final2-tex.zip \
                   dist/Sl2WeightSystemAtMinus3Over32_final2-arxiv.tar.gz; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/Sl2WeightSystemAtMinus3Over32_final2* \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
